<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Schede GdR</title>
  <meta name="description" content="Schede personaggio per D&D 5ª edizione e generiche, da usare al tavolo.">
  <meta name="theme-color" content="#0e0e10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applica subito il tema salvato per evitare lampeggi.
    try {
      var t = (JSON.parse(localStorage.getItem('gdr-schede/v1')) || {}).settings || {};
      var dark = t.theme === 'dark' || (t.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Questa app richiede JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
